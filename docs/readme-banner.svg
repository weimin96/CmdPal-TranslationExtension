<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">TranslationExtension README 顶部横幅</title>
  <desc id="bannerDesc">面向 PowerToys Command Palette 的 Windows 快速翻译扩展项目介绍图</desc>
  <defs>
